name: Check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Build, test typecheck, tests, lint, format check and docs check, as locally.
      - run: npm run check
      - name: Package
        if: runner.os == 'Linux'
        run: npm run package -w stanza-docs
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: stanza-vsix
          path: packages/vscode/stanza.vsix
